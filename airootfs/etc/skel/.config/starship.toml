# AEGIS OS - Starship Prompt Configuration (Catppuccin Mocha + Cyberpunk)

# Don't print a new line at the start of the prompt
add_newline = true

# Format of the prompt
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Cyberpunk/Catppuccin Color Palette
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# --- Modules ---

[os]
disabled = false
style = "bold mauve"

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = '[$user]($style) '
disabled = false

[hostname]
ssh_only = false
format = 'on [$hostname](bold green) '
trim_at = "-"
disabled = false

[directory]
style = "bold blue"
format = "in [$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold yellow"
format = "via [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold cyan)[❯](bold mauve)[❯](bold green)"
error_symbol = "[](bold red)[❯](bold red)[](bold red)"
vimcmd_symbol = "[❮](bold green)[❮](bold mauve)[❮](bold cyan)"